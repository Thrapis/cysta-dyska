# Developer tools: package caches, toolchains, build output and VM disks.
version: 1
rules:
  - id: go-build-cache
    owner: Go
    category: dev-cache
    risk: safe
    paths: ["{GOCACHE}"]
    explain:
      en: "Go's build cache. It speeds up builds and grows without limit; Go rebuilds what it needs."
      be: "Кэш зборкі Go. Ён паскарае зборку і расце без абмежаванняў; Go аднавіць патрэбнае сам."
    suggest:
      - text: {en: "Clear it with Go's own command.", be: "Ачысціце яго ўласнай камандай Go."}
        command: "go clean -cache"

  - id: go-mod-cache
    owner: Go
    category: dev-cache
    risk: safe
    paths: ["{GOMODCACHE}"]
    explain:
      en: "Downloaded Go modules for every version you ever used. Go downloads them again when needed."
      be: "Спампаваныя модулі Go для ўсіх версій, якімі вы карысталіся. Go спампуе іх зноў, калі спатрэбіцца."
    suggest:
      - text: {en: "Clear it with Go's own command (files are read-only, so this is easier than deleting).", be: "Ачысціце яго камандай Go (файлы толькі для чытання, таму так прасцей, чым выдаляць)."}
        command: "go clean -modcache"

  - id: npm-cache
    owner: npm
    category: dev-cache
    risk: safe
    paths: ["{NPM_CACHE}"]
    explain:
      en: "npm's download cache. npm fetches packages again when needed."
      be: "Кэш спамповак npm. npm зноў спампуе пакеты, калі спатрэбіцца."
    suggest:
      - text: {en: "Clear it with npm.", be: "Ачысціце яго праз npm."}
        command: "npm cache clean --force"

  - id: pnpm-store
    owner: pnpm
    category: dev-cache
    risk: safe
    paths: ["{PNPM_STORE}"]
    explain:
      en: "pnpm's shared package store. Packages no project uses any more stay here until pruned."
      be: "Агульнае сховішча пакетаў pnpm. Пакеты, якія больш не патрэбныя праектам, застаюцца, пакуль іх не прыбраць."
    suggest:
      - text: {en: "Remove packages no project references.", be: "Выдаліце пакеты, на якія не спасылаецца ніводны праект."}
        command: "pnpm store prune"

  - id: yarn-cache
    owner: Yarn
    category: dev-cache
    risk: safe
    paths: ["{YARN_CACHE}"]
    explain:
      en: "Yarn's download cache. Yarn fetches packages again when needed."
      be: "Кэш спамповак Yarn. Yarn зноў спампуе пакеты, калі спатрэбіцца."
    suggest:
      - text: {en: "Clear it with Yarn.", be: "Ачысціце яго праз Yarn."}
        command: "yarn cache clean"

  - id: pip-cache
    owner: pip
    category: dev-cache
    risk: safe
    paths: ["{PIP_CACHE}"]
    explain:
      en: "pip's cache of downloaded and built Python packages."
      be: "Кэш pip са спампаванымі і сабранымі пакетамі Python."
    suggest:
      - text: {en: "Clear it with pip.", be: "Ачысціце яго праз pip."}
        command: "pip cache purge"

  - id: uv-cache
    owner: uv
    category: dev-cache
    risk: safe
    paths: ["{UV_CACHE}"]
    explain:
      en: "uv's cache of Python packages and interpreters."
      be: "Кэш uv з пакетамі і інтэрпрэтатарамі Python."
    suggest:
      - text: {en: "Clear it with uv.", be: "Ачысціце яго праз uv."}
        command: "uv cache clean"

  - id: cargo-registry
    owner: Rust (Cargo)
    category: dev-cache
    risk: safe
    paths: ["{CARGO_HOME}\\registry", "{CARGO_HOME}\\git"]
    explain:
      en: "Crates downloaded by Cargo. Cargo downloads them again when a project needs them."
      be: "Крэйты, спампаваныя Cargo. Cargo спампуе іх зноў, калі праекту спатрэбяцца."
    suggest:
      - text: {en: "Close running builds, then delete this folder; it is recreated on the next build.", be: "Спыніце зборкі, потым выдаліце гэтую папку; яна з'явіцца зноў пры наступнай зборцы."}

  - id: rustup-toolchains
    owner: Rust (rustup)
    category: dev-tools
    risk: review
    paths: ["{RUSTUP_HOME}\\toolchains"]
    explain:
      en: "Installed Rust toolchains. Old nightly and stable versions add up."
      be: "Усталяваныя наборы інструментаў Rust. Старыя версіі nightly і stable займаюць шмат месца."
    suggest:
      - text: {en: "List them, then remove the ones you don't use with: rustup toolchain uninstall <name>", be: "Пералічыце іх, потым выдаліце непатрэбныя: rustup toolchain uninstall <назва>"}
        command: "rustup toolchain list"

  - id: gradle-caches
    owner: Gradle
    category: dev-cache
    risk: safe
    paths: ["{GRADLE_HOME}\\caches"]
    explain:
      en: "Gradle's dependency and build cache. Gradle downloads what it needs again."
      be: "Кэш залежнасцей і зборак Gradle. Gradle спампуе патрэбнае зноў."
    suggest:
      - text: {en: "Stop Gradle daemons first, then delete the folder.", be: "Спачатку спыніце дэманы Gradle, потым выдаліце папку."}
        command: "gradle --stop"

  - id: gradle-wrapper-dists
    owner: Gradle
    category: dev-tools
    risk: review
    paths: ["{GRADLE_HOME}\\wrapper\\dists"]
    explain:
      en: "Gradle versions downloaded by project wrappers. Old versions stay after projects upgrade."
      be: "Версіі Gradle, спампаваныя праз wrapper праектаў. Старыя версіі застаюцца пасля абнаўлення праектаў."
    suggest:
      - text: {en: "Delete versions no current project uses; a wrapper downloads its version again if needed.", be: "Выдаліце версіі, якімі не карыстаецца ніводны праект; wrapper спампуе сваю версію зноў, калі трэба."}

  - id: maven-repo
    owner: Maven
    category: dev-cache
    risk: safe
    paths: ["{MAVEN_REPO}"]
    explain:
      en: "Maven's local repository of downloaded libraries."
      be: "Лакальны рэпазіторый Maven са спампаванымі бібліятэкамі."
    suggest:
      - text: {en: "Delete it when no build is running; Maven downloads what it needs again.", be: "Выдаліце яго, калі зборкі не ідуць; Maven спампуе патрэбнае зноў."}

  - id: nuget-cache
    owner: NuGet (.NET)
    category: dev-cache
    risk: safe
    paths: ["{NUGET_PKGS}", "{LOCALAPPDATA}\\NuGet\\v3-cache"]
    explain:
      en: "NuGet packages and HTTP cache used by .NET builds."
      be: "Пакеты NuGet і HTTP-кэш, якімі карыстаюцца зборкі .NET."
    suggest:
      - text: {en: "Clear all NuGet caches with the .NET CLI.", be: "Ачысціце ўсе кэшы NuGet праз .NET CLI."}
        command: "dotnet nuget locals all --clear"

  - id: android-sdk
    owner: Android SDK
    category: dev-tools
    risk: review
    paths: ["{ANDROID_SDK}"]
    explain:
      en: "Android SDK: platforms, system images and build tools. Old versions pile up."
      be: "Android SDK: платформы, вобразы сістэмы і інструменты зборкі. Старыя версіі назапашваюцца."
    suggest:
      - text: {en: "Remove unused platforms and system images in Android Studio's SDK Manager.", be: "Выдаліце непатрэбныя платформы і вобразы ў SDK Manager у Android Studio."}

  - id: android-avd
    owner: Android Emulator
    category: vm-disk
    risk: review
    paths: ["{ANDROID_AVD}"]
    explain:
      en: "Disks of Android emulator devices."
      be: "Дыскі прылад эмулятара Android."
    suggest:
      - text: {en: "Delete devices you don't use in Android Studio's Device Manager.", be: "Выдаліце непатрэбныя прылады ў Device Manager у Android Studio."}

  - id: jetbrains-system
    owner: JetBrains IDEs
    category: dev-cache
    risk: review
    paths: ["{LOCALAPPDATA}\\JetBrains\\*"]
    explain:
      en: "Caches, indexes and logs of one JetBrains IDE version. Folders of versions you no longer run are left behind after updates."
      be: "Кэш, індэксы і журналы адной версіі IDE ад JetBrains. Папкі старых версій застаюцца пасля абнаўленняў."
    suggest:
      - text: {en: "Delete folders of IDE versions you no longer use. For the current one use File > Invalidate Caches.", be: "Выдаліце папкі версій, якімі больш не карыстаецеся. Для бягучай — File > Invalidate Caches."}

  - id: vscode-cache
    owner: Visual Studio Code
    category: app-cache
    risk: safe
    paths: ["{APPDATA}\\Code\\Cache", "{APPDATA}\\Code\\CachedData", "{APPDATA}\\Code\\CachedExtensionVSIXs"]
    explain:
      en: "VS Code caches. VS Code recreates them."
      be: "Кэш VS Code. VS Code створыць яго зноў."
    suggest:
      - text: {en: "Close VS Code, then delete the folder.", be: "Закрыйце VS Code, потым выдаліце папку."}

  - id: node-modules
    owner: JavaScript projects
    category: build-output
    risk: safe
    names: [{name: node_modules, siblings: ["package.json"]}]
    explain:
      en: "Installed dependencies of a JavaScript project. They are reinstalled from package.json."
      be: "Усталяваныя залежнасці JavaScript-праекта. Іх можна ўсталяваць зноў з package.json."
    suggest:
      - text: {en: "For projects you are not working on, delete it and run npm install (or pnpm/yarn) when you return.", be: "Для праектаў, над якімі зараз не працуеце, выдаліце яе і выканайце npm install (або pnpm/yarn), калі вернецеся."}

  - id: rust-target
    owner: Rust projects
    category: build-output
    risk: safe
    names: [{name: target, siblings: ["Cargo.toml"]}]
    explain:
      en: "Rust build output. It can grow to many gigabytes per project."
      be: "Вынік зборкі Rust. На адзін праект ён можа займаць шмат гігабайтаў."
    suggest:
      - text: {en: "Run in the project folder:", be: "Выканайце ў папцы праекта:"}
        command: "cargo clean"

  - id: gradle-build
    owner: Gradle projects
    category: build-output
    risk: safe
    names: [{name: build, siblings: ["build.gradle", "build.gradle.kts"]}]
    explain:
      en: "Gradle build output; rebuilt on the next build."
      be: "Вынік зборкі Gradle; ствараецца зноў пры наступнай зборцы."
    suggest:
      - text: {en: "Run in the project folder:", be: "Выканайце ў папцы праекта:"}
        command: "gradle clean"

  - id: dotnet-obj
    owner: .NET projects
    category: build-output
    risk: safe
    names:
      - {name: obj, siblings: ["*.csproj", "*.fsproj", "*.vbproj"]}
      - {name: bin, siblings: ["*.csproj", "*.fsproj", "*.vbproj"]}
    explain:
      en: ".NET build output; rebuilt on the next build."
      be: "Вынік зборкі .NET; ствараецца зноў пры наступнай зборцы."
    suggest:
      - text: {en: "Run in the project folder:", be: "Выканайце ў папцы праекта:"}
        command: "dotnet clean"

  - id: python-venv
    owner: Python projects
    category: build-output
    risk: review
    names: [{name: .venv, siblings: ["pyproject.toml", "requirements.txt", "setup.py"]}]
    explain:
      en: "A Python virtual environment. It can be recreated from the project's requirements, unless packages were installed by hand."
      be: "Віртуальнае асяроддзе Python. Яго можна стварыць зноў па патрабаваннях праекта, калі пакеты не ставіліся ўручную."
    suggest:
      - text: {en: "Delete it for projects you are not working on and recreate it later.", be: "Выдаліце яго для праектаў, над якімі зараз не працуеце, і стварыце зноў пазней."}

  - id: docker-desktop-disk
    owner: Docker Desktop
    category: vm-disk
    risk: review
    paths: ["{LOCALAPPDATA}\\Docker\\wsl"]
    explain:
      en: "Docker Desktop's virtual disk with all images, containers and volumes. It grows but does not shrink by itself."
      be: "Віртуальны дыск Docker Desktop з усімі вобразамі, кантэйнерамі і тамамі. Ён расце, але сам не памяншаецца."
    suggest:
      - text: {en: "Remove unused images, containers and build cache. Volumes are kept unless you add --volumes.", be: "Выдаліце непатрэбныя вобразы, кантэйнеры і кэш зборкі. Тамы застануцца, калі не дадаць --volumes."}
        command: "docker system prune"
      - text: {en: "The disk file keeps its size until Docker Desktop reclaims the space; see Docker's docs on disk usage.", be: "Файл дыска захоўвае памер, пакуль Docker Desktop не вызваліць месца; гл. дакументацыю Docker пра месца на дыску."}

  - id: wsl-disks
    owner: WSL (Linux)
    category: vm-disk
    risk: review
    paths: ["{LOCALAPPDATA}\\Packages\\*Canonical*\\LocalState", "{LOCALAPPDATA}\\wsl"]
    explain:
      en: "Virtual disks of WSL Linux distributions (ext4.vhdx). Files deleted inside Linux do not free space on Windows by themselves."
      be: "Віртуальныя дыскі дыстрыбутываў Linux у WSL (ext4.vhdx). Файлы, выдаленыя ў Linux, самі па сабе не вызваляюць месца ў Windows."
    suggest:
      - text: {en: "Let the disk give unused space back to Windows (needs a recent WSL; replace <distro>):", be: "Дазвольце дыску вяртаць вольнае месца ў Windows (патрэбна свежая WSL; падстаўце <distro>):"}
        command: "wsl --manage <distro> --set-sparse true"
